<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Aircord — an open loop of cable: the cord that never closes, because the
       last stretch is carried through the air. The dark head is the connector,
       the two fading dots are the signal crossing the gap.

       The ground is deliberately light. A charcoal squircle with a cool accent
       is the shared visual language of every terminal emulator, so the icon read
       as "another terminal" in the Dock no matter what was drawn on it. Among
       developer tools a light tile is the one that stands out.

       Proportions follow the macOS icon grid: the squircle covers ~80% of the
       canvas and the rest is transparent padding. Without that margin the icon
       sits larger than its neighbours in the Dock and loses the system shadow.

       Only <path> and <circle> are used: the SVG is rasterized by oksvg (see
       tools/genicon), which renders strokes and circles faithfully but drops the
       corner radius on <rect rx="…">.

       Source of truth: edit this SVG, then regenerate icon.png with
       `go run ./tools/genicon`. -->

  <!-- squircle: 412x412 centred in 512 -->
  <path d="M143 50 H369 A93 93 0 0 1 462 143 V369 A93 93 0 0 1 369 462
           H143 A93 93 0 0 1 50 369 V143 A93 93 0 0 1 143 50 Z" fill="#EEF2F8"/>

  <!-- the cord: an arc left open towards the right -->
  <path d="M355.6 172.4 A130 130 0 1 0 355.6 339.6" fill="none" stroke="#2B6CF6"
        stroke-width="43" stroke-linecap="round"/>

  <!-- connector head, darker than the cord so it reads as a fitting rather than
       a thicker piece of cable -->
  <circle cx="355.6" cy="172.4" r="33" fill="#1E3A8A"/>

  <!-- The signal jumping the gap. The opacities sit high for a fade: against a
       light ground the same values that read as "fading" at full size wash out
       to nothing by the time the icon is 32px in the Dock. -->
  <circle cx="405" cy="232" r="19" fill="#2B6CF6" fill-opacity="0.88"/>
  <circle cx="416" cy="289" r="12" fill="#2B6CF6" fill-opacity="0.62"/>
</svg>
