[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.95"

[workspace.dependencies]
aircord-core = { path = "crates/core" }
aircord-ble = { path = "crates/ble" }
aircord-ui = { path = "crates/ui" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "1.1", default-features = false, features = ["parse", "serde", "std"] }
regex = "1"
crc32fast = "1"
dirs = "7"
tempfile = "3"
# BLE: CoreBluetooth on macOS, BlueZ on Linux, WinRT on Windows; async, so it runs on its own tokio runtime.
btleplug = "0.13"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
futures = "0.3"
uuid = "1"
egui = "0.37"
eframe = "0.37"
egui_kittest = "0.37"
rfd = "0.18"
pollster = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
dbg_macro = "warn"
