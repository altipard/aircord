# Aircord CI — https://docs.gitlab.com/ee/ci/
#
# check    runs on every push: the same gate as `task check`
# package  runs on tags: native packages per platform
# release  runs on tags: creates the GitLab Release
#
# Packaging is native per platform (packaging/package.sh). Cross-compiling the
# window and BLE stacks needs each target's SDK, which is more machinery than it
# is worth here. The Linux package builds on the shared runners everyone has.
# macOS and Windows need GitLab SaaS runners, which are opt-in per project, so
# those jobs are manual: start them from the pipeline view once the tag is
# pushed. See README for which platforms are actually runtime-tested.

stages: [check, package, release]

variables:
  # The workspace's rust-version: CI proves the MSRV, not just the latest stable.
  RUST_VERSION: "1.95"
  CARGO_BUNDLE_VERSION: "0.12.0"
  # Where tagged packages are published, and where the release links point.
  PKG_URL: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/aircord/${CI_COMMIT_TAG}"

.rust-linux:
  image: rust:${RUST_VERSION}-bookworm
  variables:
    # Inside the project dir, so the registry can be cached.
    CARGO_HOME: $CI_PROJECT_DIR/.cargo
  before_script:
    # btleplug links libdbus (BlueZ); eframe's window stack wants the X11,
    # Wayland, xkbcommon and GL development files.
    - apt-get update -qq
    - >-
      apt-get install -y -qq pkg-config libdbus-1-dev libxkbcommon-dev
      libgl1-mesa-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev
      >/dev/null
  cache:
    key:
      files: [Cargo.lock]
      prefix: $CI_JOB_NAME
    paths:
      - .cargo/registry/index
      - .cargo/registry/cache
      - .cargo/git/db
      - target/

fmt:
  image: rust:${RUST_VERSION}-bookworm
  stage: check
  script:
    - rustup component add rustfmt
    - cargo fmt --all --check

clippy:
  extends: .rust-linux
  stage: check
  script:
    - rustup component add clippy
    - cargo clippy --workspace --all-targets --locked -- -D warnings

test:
  extends: .rust-linux
  stage: check
  script:
    - cargo test --workspace --locked
