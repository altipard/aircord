name: Release

# Tag a commit (e.g. `git tag v1.0.0 && git push github v1.0.0`) to build native
# packages for Linux, Windows and macOS and publish them as a GitHub Release.
# Tags with a suffix (v1.1.0-rc1) become pre-releases.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  RUST_VERSION: "1.95"
  CARGO_BUNDLE_VERSION: "0.12.0"
  CARGO_TERM_COLOR: always

jobs:
  package:
    name: package (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            os: linux
            arch: amd64
            ext: tar.xz
          - runner: windows-latest
            os: windows
            arch: amd64
            ext: exe
          - runner: macos-latest
            os: macos
            arch: arm64
            ext: app.zip
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@v2

      # btleplug links libdbus (BlueZ); eframe's window stack wants the X11,
      # Wayland, xkbcommon and GL development files.
      - name: Install Linux build deps
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libdbus-1-dev libxkbcommon-dev \
            libgl1-mesa-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev

      - name: Install cargo-bundle
        if: matrix.os == 'macos'
        run: cargo install cargo-bundle --locked --version "${CARGO_BUNDLE_VERSION}"

      # Native package (host OS == target OS on each runner). The version comes
      # from the tag, not Cargo.toml. No Developer ID signature; macOS users
      # right-click → Open on first launch.
      - name: Package
        id: package
        env:
          AIRCORD_TAG: ${{ github.ref_name }}
          AIRCORD_BUILD: ${{ github.run_number }}
          ASSET: aircord-${{ github.ref_name }}-${{ matrix.os }}-${{ matrix.arch }}.${{ matrix.ext }}
        run: |
          bash packaging/package.sh
          echo "asset=${ASSET}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.asset }}
          path: dist/${{ steps.package.outputs.asset }}
          if-no-files-found: error

  # One job creates the release so the matrix jobs don't race on it.
  release:
    name: publish release
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum aircord-* > SHA256SUMS.txt && cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
