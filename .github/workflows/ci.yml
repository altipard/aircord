name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # The workspace's rust-version: build and test prove the MSRV.
  RUST_VERSION: "1.95"
  CARGO_TERM_COLOR: always

# Same gate as `task check`, on both platforms the BLE stack (CoreBluetooth,
# BlueZ) and the window stack differ on.
jobs:
  # fmt and clippy on stable: lints are added and changed with every release,
  # so an older clippy flags code the current one accepts. Developers run
  # `task check` on stable; CI lints with the same rules.
  lint:
    name: fmt / clippy (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      # btleplug links libdbus (BlueZ); eframe's window stack wants the X11,
      # Wayland, xkbcommon and GL development files.
      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libdbus-1-dev libxkbcommon-dev \
            libgl1-mesa-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev

      - name: rustfmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  msrv:
    name: build / test on ${{ matrix.os }} (Rust 1.95)
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@v2

      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libdbus-1-dev libxkbcommon-dev \
            libgl1-mesa-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev

      - name: build
        run: cargo build --workspace --locked
      - name: test
        run: cargo test --workspace --locked
