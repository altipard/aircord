name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Runs on macOS: Fyne (GUI) and tinygo.org/x/bluetooth build cleanly there
# without the system dev packages a Linux runner would require.
jobs:
  check:
    name: fmt / vet / test / build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - name: gofmt check
        run: test -z "$(gofmt -l .)" || { echo 'gofmt needed:'; gofmt -l .; exit 1; }
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...
      - name: go build
        run: go build ./...

  lint:
    name: golangci-lint
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - uses: golangci/golangci-lint-action@v7
        with:
          version: latest
