# Taskfile for Aircord — https://taskfile.dev
# Install the runner:  brew install go-task/tap/go-task
# List tasks:          task
version: "3"

vars:
  BINARY: aircord
  BIN_DIR: bin

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list
    silent: true

  tidy:
    desc: Sync go.mod / go.sum
    cmds:
      - go mod tidy

  fmt:
    desc: Format all Go source
    cmds:
      - gofmt -w .

  fmt:check:
    desc: Fail if any file is not gofmt-clean
    cmds:
      - test -z "$(gofmt -l .)" || (echo 'gofmt needed:' && gofmt -l . && exit 1)

  vet:
    desc: Run go vet
    cmds:
      - go vet ./...

  lint:
    desc: Run golangci-lint (pinned, no install needed)
    cmds:
      - go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest run ./...

  test:
    desc: Run tests
    cmds:
      - go test ./...

  build:
    desc: Build the binary into ./bin
    cmds:
      - go build -o {{.BIN_DIR}}/{{.BINARY}} .

  run:
    desc: Build and run the app
    cmds:
      - go run .

  package:
    desc: Build a native app bundle (macOS .app, Linux .tar.xz, Windows .exe)
    # A bare binary started from a shell shows the launching process's icon in
    # the macOS Dock. Only the bundle carries the app's own icon and identity.
    # The CLI rewrites FyneApp.toml and bumps Build on every run.
    cmds:
      - go run fyne.io/tools/cmd/fyne@latest package

  clean:
    desc: Remove build output and legacy binaries
    cmds:
      - rm -rf {{.BIN_DIR}}
      - rm -f blescan blescan-app ble-console {{.BINARY}}

  check:
    desc: CI gate — format check, vet, lint, test
    cmds:
      - task: fmt:check
      - task: vet
      - task: lint
      - task: test
