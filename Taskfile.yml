# Taskfile for Aircord — https://taskfile.dev
# Install the runner:  brew install go-task/tap/go-task
# List tasks:          task
version: "3"

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list
    silent: true

  fmt:
    desc: Format all Rust source
    cmds:
      - cargo fmt --all

  fmt:check:
    desc: Fail if any file is not rustfmt-clean
    cmds:
      - cargo fmt --all --check

  lint:
    desc: Run clippy on every crate and target, warnings are errors
    cmds:
      - cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    desc: Run tests
    cmds:
      - cargo test --workspace --locked

  check:
    desc: CI gate — format check, clippy, test
    cmds:
      - task: fmt:check
      - task: lint
      - task: test

  build:
    desc: Build the release binary into target/release
    cmds:
      - cargo build --release --locked -p aircord

  run:
    desc: Build and run the app
    cmds:
      - cargo run -p aircord

  package:
    desc: Build the native package for this OS into dist/ (macOS .app.zip, Linux .tar.xz, Windows .exe)
    # A bare binary started from a shell shows the launching process's icon in
    # the macOS Dock. Only the bundle carries the app's own icon and identity.
    # macOS needs cargo-bundle: cargo install cargo-bundle --locked
    cmds:
      - bash packaging/package.sh

  clean:
    desc: Remove build output and packages
    cmds:
      - cargo clean
      - rm -rf dist
